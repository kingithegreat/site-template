<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITE_NAME</title>
<meta name="description" content="SITE_DESCRIPTION">
<style>
  /* Replace everything visual per the client/brief — this skeleton only proves
     structure + pipeline. Design pass is governed by the frontend-design skill. */
  :root{--bg:#0e1412;--ink:#e8f1ec;--mut:#9db3a8;--acc:#34c68c;--edge:#24312b}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  header{padding:64px 0 12px}
  h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.02em}
  h1 b{color:var(--acc)}
  .lede{color:var(--mut);max-width:56ch;margin-top:10px}
  section{padding:36px 0;border-top:1px solid var(--edge)}
  h2{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{border:1px solid var(--edge);border-radius:14px;padding:18px;background:#121a17}
  a.cta{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:999px;background:var(--acc);color:#08120d;text-decoration:none;font-weight:600}
  footer{padding:40px 0;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SITE_NAME<b>.</b></h1>
    <p class="lede">SITE_DESCRIPTION</p>
    <a class="cta" href="#contact">CTA_TEXT</a>
  </header>
  <section id="services">
    <h2>Services</h2>
    <div class="cards">
      <div class="card">SERVICE_1</div>
      <div class="card">SERVICE_2</div>
      <div class="card">SERVICE_3</div>
    </div>
  </section>
  <section id="contact">
    <h2>Contact</h2>
    <p>CONTACT_DETAILS</p>
  </section>
  <footer>© YEAR SITE_NAME — Tauranga, New Zealand</footer>
</div>
</body>
</html>
